services:
  mongodb:
    image: mongo:7.0
    container_name: omnivise-mongodb
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-omnivise_iot}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./mongo-replica-init.js:/docker-entrypoint-initdb.d/mongo-replica-init.js:ro
    networks:
      - omnivise-network
    healthcheck:
      test: |
        mongosh --eval "
          try {
            var status = rs.status();
            if (status.ok === 1 && status.members.some(m => m.stateStr === 'PRIMARY')) {
              quit(0);
            }
            quit(1);
          } catch(e) {
            try {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]});
              print('Replica set initialized');
              quit(1);
            } catch(initError) {
              quit(1);
            }
          }
        " --quiet
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongo-express:
    image: mongo-express:1.0
    container_name: omnivise-mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - omnivise-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: omnivise-backend:latest
    container_name: omnivise-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_INITDB_DATABASE:-omnivise_iot}
      BACKEND_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - omnivise-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sensor-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile
    image: omnivise-sensor-simulator:latest
    container_name: omnivise-sensor-simulator
    restart: always
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_INITDB_DATABASE:-omnivise_iot}
      MONGO_COLLECTION: sensor_readings
      INTERVAL_SECONDS: ${SIMULATOR_INTERVAL:-5}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - omnivise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: omnivise-frontend:latest
    container_name: omnivise-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - omnivise-network
    environment:
      - NGINX_PORT=80

volumes:
  mongodb_data:
    driver: local

networks:
  omnivise-network:
    driver: bridge
