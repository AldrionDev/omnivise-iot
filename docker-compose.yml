services:
  mongodb:
    image: mongo:7.0
    container_name: omnivise-mongodb
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./mongo-replica-init.js:/docker-entrypoint-initdb.d/mongo-replica-init.js:ro
    networks:
      - omnivise-network
    healthcheck:
      test: |
        mongosh --eval "
          try {
            rs.status();
            db.adminCommand('ping');
          } catch(e) {
            quit(1);
          }
        " --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongo-express:
    image: mongo-express:1.0
    container_name: omnivise-mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - omnivise-network

  sensor-simulator:
    image: omnivise-sensor-simulator
    container_name: omnivise-sensor-simulator
    restart: always
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_COLLECTION: sensor_readings
      INTERVAL_SECONDS: 5
    depends_on:
      - mongodb
    networks:
      - omnivise-network

  backend:
    build: ./backend
    container_name: omnivise-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_INITDB_DATABASE}
      BACKEND_PORT: 8080
    depends_on:
      - mongodb
    networks:
      - omnivise-network

volumes:
  mongodb_data:
    driver: local

networks:
  omnivise-network:
    driver: bridge
