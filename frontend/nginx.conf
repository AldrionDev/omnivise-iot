server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container-derived DNS resolver: populated from /etc/resolv.conf by the
    # official Nginx entrypoint's local-resolver discovery
    # (NGINX_ENTRYPOINT_LOCAL_RESOLVERS), then substituted here via envsubst
    # against NGINX_LOCAL_RESOLVERS when this file is processed as an
    # /etc/nginx/templates/*.template.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 5s;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend upstream authority (host:port) for the /api/ and /ws/ reverse
    # proxies. ${BACKEND_UPSTREAM} is substituted at container start by the
    # official Nginx entrypoint (envsubst) and defaults to "backend:8080" for
    # Docker Compose. In Kubernetes it is overridden to the backend Service's
    # fully-qualified in-cluster domain name (backend.<namespace>.<cluster
    # domain>) plus port: because proxy_pass here references a variable, Nginx
    # resolves the name at request time through the runtime "resolver" above,
    # which does NOT apply /etc/resolv.conf search/ndots, so a short Service
    # name would return NXDOMAIN in-cluster. Runtime DNS re-resolution is
    # preserved by "resolver ... valid=10s".

    # Proxy API requests to backend service
    location /api/ {
        set $backend_upstream http://${BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support
    location /ws/ {
        set $backend_upstream http://${BACKEND_UPSTREAM};
        proxy_pass $backend_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/json application/javascript;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}